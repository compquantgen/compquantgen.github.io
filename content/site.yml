# Short paragraph on the home page.
about: >-
  Livestock populations are large, deeply pedigreed, and highly related as a
  whole. That structure breaks many methods built for samples of unrelated
  people. We develop statistical theory, methods, and software for genomic
  analysis in such populations: mixed-model association and prediction for
  millions of animals, fine-mapping in related samples, and theory for what
  genomic analyses can and cannot resolve. Our tools are used in both
  animal and human genetics.

join: >-
  We welcome inquiries from prospective graduate students, postdoctoral
  researchers, and visiting scholars with backgrounds in quantitative or
  statistical genetics, statistics, or data science. Please write with a CV
  and a short description of your background and interests.

